<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Создать резюме — Campus Jobs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .form-control, .form-select {
            height: 55px;
            font-size: 1.1rem;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
        }
        .form-label {
            margin-bottom: 0.75rem;
            font-weight: 600;
            color: #212529;
        }
        .card {
            border: none;
            border-radius: 1rem;
        }
        textarea.form-control {
            height: auto;
            min-height: 300px;
        }
    </style>
</head>
<body class="bg-light">

<div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <div class="card shadow-lg" style="max-width: 800px; width: 100%;">
        <div class="card-body p-5">
            <h3 class="text-center mb-5 fw-bold text-success">Создать резюме</h3>

            <form method="post">
                {% csrf_token %}

                <div class="mb-4">
                    <label class="form-label">{{ form.title.label }}</label>
                    {{ form.title }}
                    {% if form.title.errors %}
                        <div class="text-danger small mt-2">{{ form.title.errors }}</div>
                    {% endif %}
                </div>

                <div class="mb-5">
                    <label class="form-label">{{ form.content.label }}</label>
                    {{ form.content }}
                    <div class="form-text text-muted mt-2">
                        Поддерживается Markdown: **жирный**, *курсив*, списки, заголовки и т.д.
                    </div>
                    {% if form.content.errors %}
                        <div class="text-danger small mt-2">{{ form.content.errors }}</div>
                    {% endif %}
                </div>

                <div class="d-grid d-md-flex justify-content-md-between gap-3">
                    <button type="submit" class="btn btn-success btn-lg fw-semibold shadow-sm">
                        Сохранить резюме
                    </button>
                    <a href="{% url 'profile' %}" class="btn btn-outline-secondary btn-lg">
                        Отмена
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
