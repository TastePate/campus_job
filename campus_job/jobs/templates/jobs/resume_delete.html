{% extends 'jobs/base.html' %}

{% block title %}Удалить резюме — Campus Jobs{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-danger">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0">Удалить резюме?</h4>
                </div>
                <div class="card-body">
                    <p>Вы уверены, что хотите удалить резюме <strong>"{{ resume.title }}"</strong>?</p>
                    <p class="text-muted small">Это действие нельзя отменить. Резюме будет удалено навсегда.</p>

                    <form method="post" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">Да, удалить</button>
                    </form>
                    <a href="{% url 'profile' %}" class="btn btn-secondary ms-3">Отмена</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
