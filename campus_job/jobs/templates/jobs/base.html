<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Campus Jobs{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% if user.is_authenticated %}{% if user.profile.role == 'student' %}/jobs/{% else %}/profile/{% endif %}{% else %}/{% endif %}">
            Campus Jobs
        </a>

        {% if user.is_authenticated %}
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                {% if user.profile.role == 'student' %}
                <li class="nav-item me-3">
                    <a class="nav-link {% if request.path == '/jobs/' %}active{% endif %}" href="/jobs/">Вакансии</a>
                </li>
                {% endif %}

                <li class="nav-item me-3">
                    <a class="nav-link {% if request.path == '/profile/' %}active{% endif %}" href="/profile/">Личный кабинет</a>
                </li>

                <li class="nav-item">
                    <form method="post" action="{% url 'logout' %}" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-light">Выйти</button>
                    </form>
                </li>
            </ul>
        </div>
        {% endif %}
    </div>
</nav>

<!-- Основной контент -->
<div class="container mt-4 mb-5">
    {% block content %}
    {% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
